<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"> 
    <title>¡Bienvenido a la Pasarela!</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            /* El mismo fondo que tu página principal */
            background-image: url('https://images.unsplash.com/photo-1558769132-cb1aea458c5e?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;       
            background-position: center;  
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .login-box { 
            background: white; 
            padding: 30px; 
            border-radius: 10px; 
            box-shadow: 0 0 10px rgba(0,0,0,0.1); 
            text-align: center; 
            width: 300px; 
        }
        .modelo-img {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        button { 
            width: 100%; 
            padding: 10px; 
            background-color: #007BFF; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            font-size: 16px; 
            margin-top: 10px;
            text-decoration: none; /* Para que el link parezca botón */
            display: inline-block;
            box-sizing: border-box;
        }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>¡apoyo recibido!</h2>
        <p>Gracias por participar. Prepárate para brillar en la pasarela.</p>
        
        <!-- Una imagen de modelaje de ejemplo -->
        <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=300&q=80" alt="Modelo" class="modelo-img">
        
        <!-- Botón para volver al inicio -->
        <a href="index.html" style="text-decoration: none;">
            <button>Volver al inicio</button>
        </a>
    </div>
</body>
</html>
